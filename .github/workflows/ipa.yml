# Compile un IPA iOS non signe sur un runner macOS de GitHub.
#
# Pourquoi non signe : signer exige un compte Apple Developer, que seul le
# proprietaire de l'appareil peut creer. L'IPA produit ici est resigne au moment
# de l'installation par Sideloadly ou AltStore, avec un identifiant Apple gratuit.
#
# Les runners macOS sont gratuits sur un depot public.

name: IPA iOS

on:
  workflow_dispatch:        # lancement a la main depuis l'onglet Actions
  push:
    branches: ['main']      # et automatiquement a chaque envoi sur la branche principale
    paths-ignore: ['altstore.json']   # le catalogue est ecrit par la compilation : ne pas boucler
    tags: ['v*']

jobs:
  construire:
    runs-on: macos-14
    timeout-minutes: 45
    permissions:
      contents: write       # necessaire pour creer la release

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dependances JavaScript
        run: npm install --no-audit --no-fund

      # cap sync copie la page web et inscrit le greffon de sante dans le Podfile.
      # Aucune modification du fichier projet Xcode n'est necessaire : le greffon
      # est un pod local, declare dans plugins/sante.
      - name: Copier la page et cabler le greffon
        run: npx cap sync ios

      - name: Dependances natives
        working-directory: ios/App
        run: pod install --repo-update

      - name: Compiler sans signature
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Empaqueter en IPA
        working-directory: ios/App
        run: |
          APP="build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP" || { echo "App.app introuvable"; exit 1; }
          test -f "$APP/App" || { echo "binaire compile absent"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry FonteEtMacros-non-signe.ipa Payload
          ls -lh FonteEtMacros-non-signe.ipa

      # Une release donne un lien de telechargement direct, sans compte GitHub,
      # contrairement a un artefact qui exige d'etre connecte.
      - name: Publier en release telechargeable
        working-directory: ios/App
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "ipa-${{ github.run_number }}" \
            FonteEtMacros-non-signe.ipa \
            --title "IPA ${{ github.run_number }}" \
            --notes "IPA non signe, a installer avec Sideloadly ou AltStore. Expire au bout de 7 jours avec un identifiant Apple gratuit."

      # Le catalogue est genere a partir de l'IPA reellement compile : la version
      # qu'il annonce ne peut donc plus differer de celle inscrite dans l'app,
      # ce qui faisait echouer AltStore avec « does not match the version ».
      - name: Mettre le catalogue a jour depuis l'IPA
        run: |
          cd ios/App
          rm -rf /tmp/verif && mkdir -p /tmp/verif
          unzip -o -q FonteEtMacros-non-signe.ipa -d /tmp/verif
          PLIST=/tmp/verif/Payload/App.app/Info.plist
          VERSION=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$PLIST")
          BUILD=$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "$PLIST")
          MINOS=$(/usr/libexec/PlistBuddy -c 'Print :MinimumOSVersion' "$PLIST")
          TAILLE=$(stat -f%z FonteEtMacros-non-signe.ipa)
          echo "app compilee : version $VERSION build $BUILD, iOS $MINOS, $TAILLE octets"
          cd "$GITHUB_WORKSPACE"
          node outils/catalogue.js "$VERSION" "$BUILD" "$MINOS" "$TAILLE" "ipa-${{ github.run_number }}"
          git config user.name 'github-actions'
          git config user.email 'github-actions@users.noreply.github.com'
          git add altstore.json
          git diff --staged --quiet || git commit -m "Catalogue : version $VERSION (compilation ${{ github.run_number }})"
          git push

      - uses: actions/upload-artifact@v4
        with:
          name: FonteEtMacros-ipa
          path: ios/App/FonteEtMacros-non-signe.ipa
          retention-days: 14
