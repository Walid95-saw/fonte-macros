name: IPA iOS

on:
  workflow_dispatch:
  push:
    tags: ['v*']

jobs:
  construire:
    runs-on: macos-14
    timeout-minutes: 45

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Dependances JavaScript
        run: npm install --no-audit --no-fund

      - name: Copier la page et cabler le greffon
        run: npx cap sync ios

      - name: Dependances natives
        working-directory: ios/App
        run: pod install --repo-update

      - name: Compiler sans signature
        working-directory: ios/App
        run: |
          xcodebuild \
            -workspace App.xcworkspace \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            build

      - name: Empaqueter en IPA
        working-directory: ios/App
        run: |
          APP="build/Build/Products/Release-iphoneos/App.app"
          test -d "$APP" || { echo "App.app introuvable"; exit 1; }
          mkdir -p Payload
          cp -R "$APP" Payload/
          zip -qry FonteEtMacros-non-signe.ipa Payload
          ls -lh FonteEtMacros-non-signe.ipa

      - uses: actions/upload-artifact@v4
        with:
          name: FonteEtMacros-ipa
          path: ios/App/FonteEtMacros-non-signe.ipa
          retention-days: 14
