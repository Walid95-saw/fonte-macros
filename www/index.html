<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0;font:14px system-ui,-apple-system,sans-serif}
img{max-width:100%}
[hidden]{display:none!important}
</style>
<script src="pont-sante.js"></script>
</head>
<body>
<title>Fonte &amp; Macros</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700;800&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Sans+Arabic:wght@400;500;600;700&family=IBM+Plex+Mono:wght@500;600&display=swap">
<style>
/* Layout : bandeau collant + rail d'onglets, colonne unique 1060px, grilles de fiches qui se replient en une colonne a 400px. Bilingue FR / AR, bascule complete en RTL. */
:root{
  --bg:#E8EBEF; --surface:#FFFFFF; --surface-2:#F1F4F7; --line:#D2D8DF;
  --fg:#161A20; --muted:#5A6572;
  --accent:#9E4426; --accent-soft:#F4DFD7;
  --steel:#2E6B77; --steel-soft:#DBEAEC;
  --good:#3C7A4E; --warn:#9A6D16; --bad:#A33A33;
  --prot:#2E6B77; --carb:#9E4426; --fat:#9A6D16;
  --r:10px;
  --ff-display:'Archivo','Helvetica Neue',Arial,sans-serif;
  --ff-body:'IBM Plex Sans',system-ui,-apple-system,Segoe UI,sans-serif;
  --ff-mono:'IBM Plex Mono',ui-monospace,Menlo,Consolas,monospace;
  /* teintes par famille d'aliments */
  --c-V:#B5562F; --c-P:#3E7D96; --c-L:#B08A2E; --c-F:#A8762F; --c-G:#6E8034;
  --c-Z:#3F7C43; --c-R:#BC5F27; --c-N:#7E5730; --c-M:#B08F1C; --c-B:#44809B;
  --c-S:#8A4166; --c-C:#52669A; --c-A:#9A5531;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11141A; --surface:#191E26; --surface-2:#212934; --line:#2E3742;
    --fg:#E4E8EE; --muted:#8D98A7;
    --accent:#D97B52; --accent-soft:#3B241B;
    --steel:#5FAAB7; --steel-soft:#153035;
    --good:#5FA874; --warn:#C9A14A; --bad:#D4746C;
    --prot:#5FAAB7; --carb:#D97B52; --fat:#C9A14A;
    --c-V:#E08560; --c-P:#6FB4CE; --c-L:#DCBA5F; --c-F:#D9A75F; --c-G:#A6BC63;
    --c-Z:#6DB873; --c-R:#E5915A; --c-N:#BD8F5E; --c-M:#DCC14E; --c-B:#73B6D1;
    --c-S:#C97BA5; --c-C:#8C9FD4; --c-A:#D08A60;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#11141A; --surface:#191E26; --surface-2:#212934; --line:#2E3742;
  --fg:#E4E8EE; --muted:#8D98A7;
  --accent:#D97B52; --accent-soft:#3B241B;
  --steel:#5FAAB7; --steel-soft:#153035;
  --good:#5FA874; --warn:#C9A14A; --bad:#D4746C;
  --prot:#5FAAB7; --carb:#D97B52; --fat:#C9A14A;
  --c-V:#E08560; --c-P:#6FB4CE; --c-L:#DCBA5F; --c-F:#D9A75F; --c-G:#A6BC63;
  --c-Z:#6DB873; --c-R:#E5915A; --c-N:#BD8F5E; --c-M:#DCC14E; --c-B:#73B6D1;
  --c-S:#C97BA5; --c-C:#8C9FD4; --c-A:#D08A60;
  color-scheme:dark;
}

*{box-sizing:border-box}
body{background:var(--bg);color:var(--fg);font-family:var(--ff-body);font-size:15px;line-height:1.5;margin:0}
body[dir="rtl"]{font-family:'IBM Plex Sans Arabic',var(--ff-body);line-height:1.75}
body[dir="rtl"] h1,body[dir="rtl"] h2,body[dir="rtl"] h3,body[dir="rtl"] h4,body[dir="rtl"] .brand{font-family:'IBM Plex Sans Arabic',var(--ff-display)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--surface)}
h1,h2,h3,h4{font-family:var(--ff-display);font-weight:700;margin:0;text-wrap:balance;letter-spacing:-.01em}
.num{font-family:var(--ff-mono);font-variant-numeric:tabular-nums;direction:ltr;display:inline-block}
button,input,select{font:inherit;color:inherit}

.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:var(--surface);border-bottom:1px solid var(--line)}
.top-in{max-width:1060px;margin:0 auto;padding-block:12px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  display:flex;align-items:center;gap:14px;flex-wrap:wrap}
.brand{font-family:var(--ff-display);font-weight:800;font-size:19px;letter-spacing:-.02em;direction:ltr}
.brand i{font-style:normal;color:var(--accent)}
.top-meta{margin-inline-start:auto;display:flex;gap:14px;align-items:center;color:var(--muted);font-size:13px;flex-wrap:wrap}
.top-meta b{color:var(--fg);font-family:var(--ff-mono);font-weight:600}
.lang{display:flex;border:1px solid var(--line);border-radius:7px;overflow:hidden}
.lang button{background:var(--surface-2);border:0;padding:5px 11px;cursor:pointer;font-size:13px;font-weight:600;color:var(--muted)}
.lang button[aria-pressed="true"]{background:var(--accent);color:#fff}
.rail{background:var(--surface);border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
.rail::-webkit-scrollbar{display:none}
.rail-in{max-width:1060px;margin:0 auto;display:flex;gap:2px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.rail button{background:none;border:0;border-bottom:2px solid transparent;padding:11px 13px;cursor:pointer;
  color:var(--muted);font-weight:500;white-space:nowrap;font-size:14px}
.rail button:hover{color:var(--fg)}
.rail button[aria-selected="true"]{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
main{max-width:1060px;margin:0 auto;padding-block:22px 56px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}

.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:18px}
.stack{display:flex;flex-direction:column;gap:16px}
.grid{display:grid;gap:16px}
.g2{grid-template-columns:repeat(auto-fit,minmax(260px,1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(190px,1fr))}
.eyebrow{font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--muted);font-weight:600}
.lede{color:var(--muted);font-size:14px;max-width:62ch}
.sep{height:1px;background:var(--line);border:0;margin:0}

.field{display:flex;flex-direction:column;gap:5px;min-width:0}
.field label{font-size:12px;font-weight:600;color:var(--muted);letter-spacing:.02em}
.field input,.field select,.inp{background:var(--surface-2);border:1px solid var(--line);border-radius:7px;padding:8px 10px;width:100%;min-width:0}
.field input:focus-visible,.field select:focus-visible,.inp:focus-visible,button:focus-visible{outline:2px solid var(--accent);outline-offset:1px}
.hint{font-size:12px;color:var(--muted)}
.btn{background:var(--accent);color:#fff;border:0;border-radius:7px;padding:9px 15px;font-weight:600;cursor:pointer}
.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--surface-2);color:var(--fg);border:1px solid var(--line)}
.btn.mini{padding:5px 9px;font-size:13px;border-radius:6px}
.btn[disabled]{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end}

.kpi{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:14px}
.kpi .k{font-family:var(--ff-mono);font-size:27px;font-weight:600;letter-spacing:-.02em;line-height:1.1;direction:ltr}
.kpi .u{font-size:13px;color:var(--muted);font-family:var(--ff-body);font-weight:400}
.kpi .n{font-size:12px;color:var(--muted);margin-top:3px;line-height:1.45}
.kpi .x{font-size:12.5px;color:var(--muted);line-height:1.55;margin:10px 0 0;padding-top:10px;border-top:1px solid var(--line)}
.kpi.hero .x{border-top-color:var(--accent);opacity:.85}
.kpi.hero{background:var(--accent-soft);border-color:transparent}
.kpi.hero .k{color:var(--accent);font-size:34px}

.macro{display:grid;grid-template-columns:86px 1fr auto;gap:10px;align-items:center;padding:7px 0}
.macro+.macro{border-top:1px solid var(--line)}
.macro .nm{font-size:13px;font-weight:600}
.bar{height:9px;border-radius:5px;background:var(--surface-2);overflow:hidden;border:1px solid var(--line)}
.bar>span{display:block;height:100%;border-radius:4px}
.macro .vl{font-family:var(--ff-mono);font-size:13px;font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr}
.sw{width:9px;height:9px;border-radius:2px;display:inline-block;vertical-align:middle;margin-inline-end:5px}

.tw{overflow-x:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
table{border-collapse:collapse;width:100%;font-size:14px}
th{text-align:start;font-size:11px;letter-spacing:.07em;text-transform:uppercase;color:var(--muted);
  font-weight:600;padding:9px 12px;border-bottom:1px solid var(--line);white-space:nowrap;background:var(--surface-2)}
td{padding:9px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
tr:last-child td{border-bottom:0}
td.n,th.n{text-align:end;font-family:var(--ff-mono);font-variant-numeric:tabular-nums;white-space:nowrap;direction:ltr}
th.n{font-family:inherit}
tbody tr:hover{background:var(--surface-2)}
td.e,th.e{text-align:end}

.chip{display:inline-block;font-size:11px;padding:2px 7px;border-radius:999px;background:var(--steel-soft);
  color:var(--steel);font-weight:600;white-space:nowrap}
.chip.a{background:var(--accent-soft);color:var(--accent)}
.note{border-inline-start:3px solid var(--steel);background:var(--steel-soft);padding:10px 13px;border-radius:7px;font-size:13px}
.note.warn{border:1px solid var(--line);border-inline-start:3px solid var(--warn);background:transparent}
.empty{border:1px dashed var(--line);border-radius:var(--r);padding:26px 18px;text-align:center;color:var(--muted);font-size:14px}
.empty strong{display:block;color:var(--fg);font-family:var(--ff-display);font-size:16px;margin-bottom:5px}

/* --- vignettes d'aliments --- */
.vig{width:38px;height:38px;border-radius:9px;background:var(--surface-2);border:1px solid var(--line);
  display:grid;place-items:center;flex:0 0 auto;overflow:hidden;position:relative}
.vig svg{width:24px;height:24px}
.vig img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block;background:var(--surface-2)}
.vig.s{width:30px;height:30px;border-radius:7px}
.vig.s svg{width:19px;height:19px}
.vig.xl{width:54px;height:54px;border-radius:11px}
.vig.xl svg{width:33px;height:33px}
.photo-btn{position:absolute;inset:auto 0 0 0;height:14px;background:var(--accent);color:#fff;border:0;
  font-size:9px;line-height:14px;cursor:pointer;opacity:0;transition:opacity .15s;padding:0}
.vig:hover .photo-btn,.vig:focus-within .photo-btn{opacity:1}

.hits{max-height:340px;overflow-y:auto;border:1px solid var(--line);border-radius:var(--r);background:var(--surface)}
.hit{display:flex;gap:11px;align-items:center;padding:7px 12px;border:0;border-bottom:1px solid var(--line);
  border-inline-start:3px solid transparent;cursor:pointer;background:none;width:100%;text-align:start}
.hit:last-child{border-bottom:0}
.hit:hover,.hit[aria-current="true"]{background:var(--surface-2)}
.hit[aria-current="true"]{border-inline-start-color:var(--accent)}
.hit .t{font-weight:500;font-size:14px}
.hit .s{font-size:12px;color:var(--muted)}
.hit .v{font-family:var(--ff-mono);font-size:12.5px;color:var(--muted);white-space:nowrap;margin-inline-start:auto;direction:ltr}
.hit .v b{color:var(--fg)}
.nom{display:flex;align-items:center;gap:10px}

.meal h4{font-size:13px;letter-spacing:.04em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-bottom:6px}
.del{background:none;border:0;color:var(--muted);cursor:pointer;padding:2px 6px;border-radius:5px;font-size:15px;line-height:1}
.del:hover{color:var(--bad);background:var(--surface-2)}

/* --- silhouettes animees des exercices --- */
.mv{width:46px;height:46px;flex:0 0 auto;direction:ltr;overflow:visible}
.mv.gr{width:170px;height:170px}
.mv .co,.mv .br,.mv .tr{stroke:var(--fg);stroke-width:5;stroke-linecap:round;stroke-linejoin:round}
.mv .tr{stroke-width:11}
.mv .br{stroke:var(--accent)}
.mv .j2{stroke:var(--muted);stroke-width:4.4}
.mv .tt{fill:var(--fg)}
.mv .pl{fill:var(--accent);fill-opacity:.3;stroke:var(--accent);stroke-width:2.5}
.mv .fx{stroke:var(--muted);stroke-width:3.4;fill:var(--muted);fill-opacity:.25;stroke-linecap:round}
.mv .cb{stroke:var(--steel);stroke-width:2;stroke-dasharray:3 3}
.mv .sol{stroke:var(--line);stroke-width:2.5;stroke-linecap:round}
.exo{background:none;border:0;padding:0;color:inherit;font:inherit;text-align:start;cursor:pointer;
  display:flex;align-items:center;gap:9px;width:100%;border-radius:6px}
.exo:hover{color:var(--accent)}
.exo .lp{width:9px;height:9px;border-radius:50%;border:2px solid var(--accent);flex:0 0 auto;opacity:.55}
.exo:hover .lp{opacity:1;background:var(--accent)}
.mvcard{display:flex;gap:20px;align-items:flex-start;flex-wrap:wrap}
.mvcard .fig{background:var(--surface-2);border:1px solid var(--line);border-radius:var(--r);padding:8px;flex:0 0 auto}
.mvcard .txt{flex:1 1 240px;min-width:0}
@media (prefers-reduced-motion:reduce){.mv{animation:none}}
svg.chart{direction:ltr}
svg .ax{stroke:var(--line);stroke-width:1}
svg .lbl{fill:var(--muted);font-size:11px;font-family:var(--ff-mono)}
@media (prefers-reduced-motion:no-preference){.fade{animation:f .25s ease-out}}
@keyframes f{from{opacity:0;transform:translateY(4px)}to{opacity:1;transform:none}}
@media (max-width:520px){ .top-meta{width:100%;margin-inline-start:0} .kpi .k{font-size:24px} .kpi.hero .k{font-size:29px} }
</style>

const DUREE="2.8s";
function anim(attr,val){
  return `<animate attributeName="${attr}" dur="${DUREE}" repeatCount="indefinite" calcMode="spline"
    keyTimes="0;0.5;1" keySplines=".45 0 .55 1;.45 0 .55 1" values="${val[0]};${val[1]};${val[0]}"/>`;
}
/* La tete prolonge l'axe du tronc : elle suit donc l'inclinaison du buste
   au lieu d'etre posee a la main pose par pose. */
function tete(corps,inverse){
  const p=corps.trim().split(/\s+/).map(s=>s.split(",").map(Number));
  const ep = inverse?p[0]:p[p.length-1], vo = inverse?p[1]:p[p.length-2];
  const dx=ep[0]-vo[0], dy=ep[1]-vo[1], d=Math.hypot(dx,dy)||1;
  return [ep[0]+dx/d*11.5, ep[1]+dy/d*11.5];
}
/* le buste (hanche-epaule) est redessine plus epais pour se detacher des membres */
function tronc(corps,inverse){
  return corps.map(p=>{const a=p.trim().split(/\s+/); return (inverse?a.slice(0,2):a.slice(-2)).join(" ")});
}
function figure(cle,grand){
  const m=MOTIFS[cle]; if(!m) return "";
  const ligne=(cls,v)=>`<polyline class="${cls}" points="${v[0]}" fill="none">${anim("points",v)}</polyline>`;
  const tA=tete(m.corps[0],m.inverse), tB=tete(m.corps[1],m.inverse);
  const plaque = m.plaque ? `<circle class="pl" cx="${m.plaque[0][0]}" cy="${m.plaque[0][1]}" r="7.5">
      ${anim("cx",[m.plaque[0][0],m.plaque[1][0]])}${anim("cy",[m.plaque[0][1],m.plaque[1][1]])}</circle>` : "";
  /* le cable relie un point fixe a la main, c'est-a-dire au dernier point du bras */
  const a=m.bras[0].trim().split(/\s+/).pop().split(","), b=m.bras[1].trim().split(/\s+/).pop().split(",");
  const cable = m.cable ? `<line class="cb" x1="${m.cable[0]}" y1="${m.cable[1]}" x2="${a[0]}" y2="${a[1]}">
      ${anim("x2",[a[0],b[0]])}${anim("y2",[a[1],b[1]])}</line>` : "";
  return `<svg class="mv${grand?" gr":""}" viewBox="0 0 120 120" role="img" aria-label="${esc(L(m.t))}">
    <line class="sol" x1="8" y1="112" x2="112" y2="112"/>
    <g class="fx">${m.fixe||""}${cable}</g>
    ${m.jambe2?ligne("co j2",m.jambe2):""}
    ${ligne("tr",tronc(m.corps,m.inverse))}
    ${ligne("co",m.corps)}
    ${ligne("br",m.bras)}
    <circle class="tt" cx="${tA[0].toFixed(1)}" cy="${tA[1].toFixed(1)}" r="7.5">
      ${anim("cx",[tA[0].toFixed(1),tB[0].toFixed(1)])}${anim("cy",[tA[1].toFixed(1),tB[1].toFixed(1)])}</circle>
    ${plaque}
  </svg>`;
}

/* ============================ CALCULS ============================ */
function calculs(p){
  const bmr = p.sexe==="h"
    ? 10*p.poids + 6.25*p.taille - 5*p.age + 5
    : 10*p.poids + 6.25*p.taille - 5*p.age - 161;
  const tdee = bmr*ACT[p.activite].f;
  const adj  = OBJ[p.objectif].r[p.rythme];
  const kcal = r0(tdee*(1+adj));
  const prot = r0(p.protKg*p.poids);
  const lip  = r0(p.lipKg*p.poids);
  const glu  = r0((kcal - prot*4 - lip*9)/4);
  const kgSem = (kcal-tdee)*7/7700;
  return {bmr:r0(bmr),tdee:r0(tdee),kcal,prot,lip,glu,adj,kgSem,
          eau:r0(p.poids*35+500), fibres:r0(kcal/1000*14)};
}
function aliments(){
  return BASE.concat(S.persos.map(a=>[a.nom,a.cat,a.kcal,a.p,a.g,a.l,a.id,a.nomAr]));
}
function totauxJour(){
  const e=(S.journal[S.jour]||{entrees:[]}).entrees||[];
  return e.reduce((o,x)=>{const q=x.qte/100;
    o.kcal+=x.kcal*q;o.p+=x.p*q;o.g+=x.g*q;o.l+=x.l*q;return o},{kcal:0,p:0,g:0,l:0});
}
/* ---- repas composes ---- */
/* Une recette garde le nom de ses aliments et leur quantite, pas leurs calories :
   si tu corriges un aliment, toutes les recettes qui l'utilisent suivent. */
function totauxRecette(r){
  return (r.items||[]).reduce((t,it)=>{
    const a=aliments().find(x=>x[0]===it.nom);
    if(!a) return t;
    const q=it.qte/100;
    t.kcal+=a[2]*q; t.p+=a[3]*q; t.g+=a[4]*q; t.l+=a[5]*q; return t;
  },{kcal:0,p:0,g:0,l:0});
}
function recetteParId(id){ return S.recettes.find(r=>r.id===id) }
function nouvelId(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,5) }

/* Ajoute les aliments d'une recette au journal d'une date, dans une prise donnee.
   Les lignes restent independantes : tu peux en retirer ou en corriger une seule. */
function versJournal(recette,date,ri,facteur){
  const j=S.journal[date]||{date,v:2,entrees:[]};
  const ajouts=[];
  for(const it of recette.items||[]){
    const a=aliments().find(x=>x[0]===it.nom);
    if(!a) continue;
    ajouts.push({id:nouvelId(),nom:a[0],ri,qte:r1(it.qte*(facteur||1)),
      kcal:a[2],p:a[3],g:a[4],l:a[5],rec:recette.nom});
  }
  j.entrees=(j.entrees||[]).concat(ajouts);
  S.journal[date]=j;
  return {doc:j,n:ajouts.length};
}

/* ---- plan de la semaine ---- */
function planDuJour(js){ return S.semaine[js]||[] }
function totauxJourPlan(js){
  return planDuJour(js).reduce((t,e)=>{
    const r=recetteParId(e.rid); if(!r) return t;
    const x=totauxRecette(r);
    t.kcal+=x.kcal; t.p+=x.p; t.g+=x.g; t.l+=x.l; return t;
  },{kcal:0,p:0,g:0,l:0});
}

function lissage(pes,n){
  return pes.map((pt,i)=>{
    const t0=new Date(pt.date).getTime()-(n-1)*864e5;
    let s=0,c=0;
    for(let j=i;j>=0;j--){ if(new Date(pes[j].date).getTime()<t0) break; s+=pes[j].poids; c++ }
    return {date:pt.date,poids:s/c};
  });
}
function tendance(){
  const p=S.pesees; if(p.length<2) return null;
  const l=lissage(p,7), fin=l[l.length-1], t1=new Date(fin.date).getTime();
  let deb=l[0];
  for(const x of l){ if(t1-new Date(x.date).getTime()<=28*864e5){deb=x;break} }
  const j=(t1-new Date(deb.date).getTime())/864e5;
  if(j<5) return null;
  return {parSem:(fin.poids-deb.poids)/j*7, lisse:fin.poids, jours:r0(j)};
}

/* ============================ VIGNETTE ============================ */
function icone(nom,cat){
  const n=norm(nom);
  for(const [re,id] of ICO_RULES) if(re.test(n)) return id;
  return ICO_CAT[cat]||"i-plate";
}
const slugAl = n => n.toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"")
  .replace(/[^a-z0-9]+/g,"-").replace(/^-|-$/g,"");
/* photo embarquee : PHOTOS garde l'extension, le chemin est img/<slug>.<ext> */
function cheminPhoto(nom){ const s=slugAl(nom); return PHOTOS[s] ? `img/${s}.${PHOTOS[s]}` : null }

function vignette(a,taille){
  const cle=a[0], perso=S.photos[cle], src = perso ? `/_blob/${esc(perso)}` : cheminPhoto(cle);
  /* le dessin reste dessous : il reapparait si la photo ne charge pas */
  const fond = `<svg viewBox="0 0 24 24" style="color:var(--c-${a[1]})" fill="currentColor" fill-opacity=".22"
      stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><use href="#${icone(cle,a[1])}"></use></svg>`;
  const img = src ? `<img src="${src}" alt="${esc(nomDe(a))}" loading="lazy" decoding="async" onerror="this.remove()">` : "";
  const btn = ASSETS ? `<button class="photo-btn" data-photo="${esc(cle)}" title="${t("photo_t")}">${t("photo")}</button>` : "";
  return `<span class="vig${taille?" "+taille:""}">${fond}${img}${btn}</span>`;
}

/* ============================ PERSISTANCE ============================ */
/* Deux supports. Dans l'artifact, le magasin de Claude ; dans l'APK, le stockage
   de l'appareil. On ecrit toujours en local, ce qui sert aussi de secours hors ligne. */
let userDoc=null, ASSETS=null;
const CLE_LOCALE="fonte_macros_v1";

function sauveLocal(){
  try{ localStorage.setItem(CLE_LOCALE, JSON.stringify({
    v:2, profil:S.profil, photos:S.photos, pesees:S.pesees,
    journal:S.journal, persos:S.persos, seances:S.seances, sante:S.sante,
    recettes:S.recettes, semaine:S.semaine })) }
  catch(_){ /* navigation privee ou stockage plein : on continue sans */ }
}
function chargeLocal(){
  let d=null;
  try{ d=JSON.parse(localStorage.getItem(CLE_LOCALE)||"null") }catch(_){}
  if(!d) return false;
  if(d.profil){ S.profil={...DEFAUT,...d.profil}; S.profilCharge=true }
  S.photos=d.photos||{}; S.pesees=d.pesees||[]; S.journal=d.journal||{};
  S.persos=d.persos||[]; S.seances=d.seances||[]; S.sante=d.sante||S.sante;
  S.recettes=d.recettes||[]; S.semaine=d.semaine||{};
  return true;
}
async function connecte(){
  try{
    const db = await window.claude?.use?.("db");
    const user = await window.claude?.use?.("user");
    if(!db || !user) return majSync(false);
    const uid = await user.id();
    if(!uid) return majSync(false);
    S.db=db; S.uid=uid;
    userDoc = db.collection("data/users/"+uid).doc("fonte");
    majSync(true);
    claude.use("assets").then(a=>{ if(a){ ASSETS=a; rend() } }).catch(()=>{});
    const pr = await userDoc.get();
    if(pr.exists){
      const d=pr.data();
      if(d.profil){ S.profil={...DEFAUT,...d.profil}; S.profilCharge=true }
      if(d.photos) S.photos=d.photos;
      if(d.semaine) S.semaine=d.semaine;
      if(d.sante) S.sante={...S.sante,...d.sante};
    }
    const [pes,jrn,per,sea,rec]=await Promise.all([
      userDoc.collection("pesees").orderBy("date").get(),
      userDoc.collection("journal").get(),
      userDoc.collection("aliments").get(),
      userDoc.collection("seances").orderBy("date","desc").limit(60).get(),
      userDoc.collection("recettes").get()
    ]);
    S.recettes = rec.docs.map(d=>({id:d.id,...d.data()}));
    S.pesees = pes.docs.map(d=>d.data()).filter(x=>x&&x.date).sort((a,b)=>a.date<b.date?-1:1);
    jrn.docs.forEach(d=>{ S.journal[d.id]=structuredClone(d.data()) });
    migreJournal();
    S.persos = per.docs.map(d=>({id:d.id,...d.data()}));
    S.seances = sea.docs.map(d=>({id:d.id,...d.data()}));
    rend();
  }catch(e){ majSync(false); console.warn("db indisponible",e) }
}
/* Trois etats : magasin distant, stockage de l'appareil, ou rien du tout.
   Dans l'APK il n'y a pas de magasin distant, mais le stockage local fonctionne :
   annoncer « non sauvegarde » serait faux et inquietant. */
function stockageLocalDispo(){
  try{ localStorage.setItem("fm_test","1"); localStorage.removeItem("fm_test"); return true }
  catch(_){ return false }
}
function majSync(on){
  S.sync=on;
  const el=document.getElementById("hdSync"); if(!el) return;
  const etat = on ? "nuage" : (stockageLocalDispo() ? "appareil" : "aucun");
  el.textContent = t("sync_"+etat);
  el.title = t("sync_"+etat+"_t");
}
async function ecrire(fn){
  sauveLocal();
  if(!userDoc) return;
  try{ await fn(userDoc) }
  catch(e){ console.warn("ecriture refusee",e); majSync(false) }
}
/* Les premieres versions ne connaissaient que 4 prises fixes. On replace ce qui a
   ete note sur la liste de reference, une fois, puis on marque la journee v:2. */
const ANCIENS=["Petit-dejeuner","Dejeuner","Diner","Collation"], VERS=[0,2,4,3];
function migreJournal(){
  for(const [jour,d] of Object.entries(S.journal)){
    if(!d || d.v>=2 || !Array.isArray(d.entrees)) continue;
    d.entrees=d.entrees.map(x=>{
      const vieux = typeof x.ri==="number" ? x.ri : ANCIENS.indexOf(x.repas);
      const {repas,...reste}=x;
      return {...reste, ri: VERS[vieux] !== undefined ? VERS[vieux] : 0};
    });
    d.v=2;
    ecrire(doc=>doc.collection("journal").doc(jour).set(d));
  }
}
async function sauveProfil(){
  await ecrire(async d=>{ await d.set({profil:S.profil, photos:S.photos, maj:new Date().toISOString()}) });
}

const ONGLETS=[["profil","tab_profil"],["poids","tab_poids"],["nutrition","tab_nutrition"],

/* L'enveloppe mobile expose window.Sante. Dans la page web il n'existe pas :
   l'onglet explique alors ou trouver l'application. Le pont rend, par journee :
   kcal = depense active mesuree, dist = metres, sommeil = minutes, fc = battements/min, pas. */
function pontSante(){ return (typeof window!=="undefined" && window.Sante) || null }

async function brancheSante(){
  const p=pontSante();
  if(!p){ S.santeEtat="absent"; return }
  try{
    const d=await p.disponible();
    S.sante.source=(d&&d.source)||"";
    S.sante.raison=(d&&d.raison)||"";
    S.sante.manquantes=(d&&d.manquantes)||[];
    if(!d||!d.ok){ S.santeEtat="indisponible"; rend(); return }
    S.santeEtat = d.autorise ? "connecte" : "a_autoriser";
    if(d.autorise) await litSante();
    rend();
  }catch(e){ console.warn("sante",e); S.santeEtat="indisponible"; rend() }
}
async function litSante(){
  const p=pontSante(); if(!p) return;
  const fin=new Date(), debut=new Date(fin.getTime()-29*864e5);
  const lignes=await p.jours(iso(debut),iso(fin));
  for(const l of lignes||[]) if(l&&l.date) S.sante.jours[l.date]=l;
  if(p.seances){
    try{ S.sante.seances=await p.seances(iso(debut),iso(fin))||[] }
    catch(e){ console.warn("seances montre",e) }
  }
  S.sante.maj=new Date().toISOString();
  await ecrire(doc=>doc.set({profil:S.profil,photos:S.photos,sante:S.sante,maj:S.sante.maj}));
}
function santeDuJour(d){ return S.sante.jours[d||S.jour]||null }

/* ---- estimation contre mesure ----
   Deux chiffres qui ne mesurent pas la meme chose :
   l'application estime l'effort depuis la duree et le poids, la montre mesure
   la depense pendant ses propres seances. On garde la moyenne des deux quand
   les deux existent, parce qu'aucun n'est plus vrai que l'autre. */
function comparaisonJour(date){
  const miennes=S.seances.filter(s=>s.date===date);
  if(!miennes.length) return null;
  const estime=miennes.reduce((t,s)=>t+kcalSeance(s),0);
  const duree=miennes.reduce((t,s)=>t+(s.duree||0),0);
  const dMontre=(S.sante.seances||[]).filter(s=>s.date===date&&s.kcal!=null);
  const mesure=dMontre.length?dMontre.reduce((t,s)=>t+s.kcal,0):null;
  return {
    date, estime:r0(estime), duree,
    mesure: mesure!=null?r0(mesure):null,
    nMontre: dMontre.length,
    retenu: mesure!=null?r0((estime+mesure)/2):r0(estime),
    ecart: mesure!=null&&estime>0?r0((mesure-estime)/estime*100):null,
    types:[...new Set(miennes.map(s=>s.type==="cardio"?"cardio":"muscu"))]
  };
}
function comparaisons(n){
  return [...new Set(S.seances.map(s=>s.date))].sort().reverse().slice(0,n||10)
    .map(comparaisonJour).filter(Boolean);
}

/* Cible dynamique : socle au repos + depense active reellement mesuree.
   Le facteur d'activite du profil est alors ignore, sinon l'effort compterait deux fois. */
function cibleDuJour(c,date){
  const h=santeDuJour(date);
  if(!S.sante.cibleDyn || !h || !h.kcal) return {kcal:c.kcal,dyn:false};
  const socle=calculs({...S.profil,activite:"sedentaire"}).tdee;
  return {kcal:r0((socle+h.kcal)*(1+c.adj)), dyn:true, actif:r0(h.kcal)};
}

function rend(){

  document.getElementById("hdKcalL").innerHTML=`${t("cible")} <b id="hdKcal">${c.kcal}</b> ${t("kcal")}`;

  document.getElementById("rail").innerHTML=ONGLETS.map(([k,lab])=>
    `<button role="tab" data-tab="${k}" aria-selected="${S.tab===k}">${t(lab)}</button>`).join("");
  const v=document.getElementById("vue");

                base:vBase,entrainement:vEntrainement,sante:vSante})[S.tab](c);
  /* SMIL ne se coupe pas en CSS : on fige la pose de depart si le systeme demande moins d'animation */
  try{ if(matchMedia("(prefers-reduced-motion: reduce)").matches)
    v.querySelectorAll("svg.mv").forEach(s=>s.pauseAnimations()) }catch(_){}

function graphe(p){
  const W=720,H=230,mL=44,mR=14,mT=16,mB=26;
  const l=lissage(p,7);
  const tt=p.map(x=>new Date(x.date).getTime());
  const t0=Math.min(...tt), t1=Math.max(...tt), dt=t1-t0||1;
  const vals=p.map(x=>x.poids).concat([S.profil.cible]);
  let v0=Math.min(...vals), v1=Math.max(...vals);
  const pad=Math.max(0.6,(v1-v0)*0.15); v0-=pad; v1+=pad;
  const X=d=>mL+(new Date(d).getTime()-t0)/dt*(W-mL-mR);
  const Y=v=>mT+(v1-v)/(v1-v0)*(H-mT-mB);
  const gy=[];
  for(let i=0;i<=4;i++){const v=v0+(v1-v0)*i/4;
    gy.push(`<line class="ax" x1="${mL}" y1="${Y(v).toFixed(1)}" x2="${W-mR}" y2="${Y(v).toFixed(1)}" opacity=".55"/><text class="lbl" x="${mL-7}" y="${(Y(v)+4).toFixed(1)}" text-anchor="end">${v.toFixed(1)}</text>`)}
  const ptsBrut=p.map(x=>`${X(x.date).toFixed(1)},${Y(x.poids).toFixed(1)}`).join(" ");
  const ptsLisse=l.map(x=>`${X(x.date).toFixed(1)},${Y(x.poids).toFixed(1)}`).join(" ");
  const aire=`${mL},${(H-mB).toFixed(1)} ${ptsLisse} ${(W-mR).toFixed(1)},${(H-mB).toFixed(1)}`;
  const fin=l[l.length-1];
  const cy=Y(S.profil.cible), dans = cy>mT && cy<H-mB;
  return `<svg class="chart" viewBox="0 0 ${W} ${H}" width="100%" style="max-width:100%;display:block" role="img"
      aria-label="${frDate(p[0].date)} — ${frDate(p[p.length-1].date)} : ${r1(fin.poids)} kg">
    <defs><linearGradient id="gAire" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="var(--accent)" stop-opacity=".22"/><stop offset="100%" stop-color="var(--accent)" stop-opacity="0"/>
    </linearGradient></defs>
    ${gy.join("")}
    ${dans?`<line x1="${mL}" y1="${cy.toFixed(1)}" x2="${W-mR}" y2="${cy.toFixed(1)}" stroke="var(--steel)" stroke-width="1.5" stroke-dasharray="5 4"/>
      <text class="lbl" x="${W-mR}" y="${(cy-6).toFixed(1)}" text-anchor="end" fill="var(--steel)">${r1(S.profil.cible)} kg</text>`:""}
    <polygon points="${aire}" fill="url(#gAire)"/>
    <polyline points="${ptsBrut}" fill="none" stroke="var(--muted)" stroke-width="1.2" opacity=".5"/>
    ${p.map(x=>`<circle cx="${X(x.date).toFixed(1)}" cy="${Y(x.poids).toFixed(1)}" r="2.2" fill="var(--muted)" opacity=".6"/>`).join("")}
    <polyline points="${ptsLisse}" fill="none" stroke="var(--accent)" stroke-width="2.4" stroke-linejoin="round" stroke-linecap="round"/>
    <circle cx="${X(fin.date).toFixed(1)}" cy="${Y(fin.poids).toFixed(1)}" r="9" fill="var(--accent)" opacity=".2"/>
    <circle cx="${X(fin.date).toFixed(1)}" cy="${Y(fin.poids).toFixed(1)}" r="5" fill="var(--accent)"/>
    <text class="lbl" x="${mL}" y="${H-7}">${frDate(p[0].date)}</text>

function apercu(a,q){
  return `${r0(q)} ${t("g")} = <span class="num">${r0(a[2]*q/100)}</span> ${t("kcal")} · ${t("prot")} <span class="num">${r1(a[3]*q/100)}</span> ${t("g")} · ${t("gluc")} <span class="num">${r1(a[4]*q/100)}</span> ${t("g")} · ${t("lip")} <span class="num">${r1(a[5]*q/100)}</span> ${t("g")}`;

function blocHits(liste,a){

    `<button class="hit" data-pick="${i}" aria-current="${!!(a&&a[0]===x[0])}">

function blocRepas(e){
  if(!e.length) return `<div class="empty"><strong>${t("jour_vide_t")}</strong>${t("jour_vide")}</div>`;
  /* on affiche toute prise qui porte quelque chose, meme si elle n'est plus au plan */
  return REPAS.map((r,ri)=>{
    const items=e.filter(x=>x.ri===ri);
    if(!items.length) return "";
    const sk=items.reduce((s,x)=>s+x.kcal*x.qte/100,0);
    return `<div class="meal">
    <div class="row" style="justify-content:space-between;align-items:center;margin-bottom:6px">
      <h4 style="margin:0">${L(r)} · <span class="num">${r0(sk)}</span> ${t("kcal")}</h4>
      <button class="btn ghost mini" data-nommer="${ri}">${t("rec_enregistrer")}</button>
    </div>
    ${S.nommeRecette===ri?`<div class="row" style="margin-bottom:8px">
      <div class="field" style="flex:2 1 200px"><label for="rec_nom">${t("rec_nom")}</label>
        <input id="rec_nom" placeholder="${esc(t("rec_exemple"))}"></div>
      <button class="btn" data-creerec="${ri}">${t("creer")}</button>
      <button class="btn ghost" id="rec_annule">${t("annuler")}</button>
    </div>`:""}
    <div class="tw"><table><tbody>
    ${items.map(x=>{
      const al=aliments().find(y=>y[0]===x.nom)||[x.nom,"A",x.kcal,x.p,x.g,x.l];
      return `<tr><td><span class="nom">${vignette(al,"s")}<span>${esc(nomDe(al))}</span></span></td>
      <td class="n" style="color:var(--muted)">${r0(x.qte)} ${t("g")}</td>
      <td class="n">${r0(x.kcal*x.qte/100)} ${t("kcal")}</td>
      <td class="n" style="color:var(--muted)">${r1(x.p*x.qte/100)} / ${r1(x.g*x.qte/100)} / ${r1(x.l*x.qte/100)}</td>
      <td class="e" style="width:1%"><button class="del" data-delentree="${x.id}" aria-label="${esc(nomDe(al))}">&times;</button></td></tr>`}).join("")}
    </tbody></table></div></div>`}).join("");
}
function macroJour(nom,v,cible,col){
  const pct=cible?Math.min(100,v/cible*100):0;
  return `<div class="macro"><div class="nm"><span class="sw" style="background:${col}"></span>${nom}</div>
    <div class="bar"><span style="width:${pct}%;background:${col}"></span></div>
    <div class="vl">${r0(v)} / ${cible} ${t("g")}</div></div>`;
}
/* la prise du plan dont l'heure habituelle est la plus proche de maintenant */
function repasSuggere(){
  const d=new Date(), h=d.getHours()+d.getMinutes()/60;
  return plan().reduce((a,b)=>Math.abs(HEURE[b[0]]-h)<Math.abs(HEURE[a[0]]-h)?b:a)[0];
}
function recherche(){
  const q=norm(S.q.trim()), qa=S.q.trim();
  return aliments().filter(a=>(!S.cat||a[1]===S.cat)&&(!qa||norm(a[0]).includes(q)||nomDe(a).includes(qa)))
    .sort((a,b)=>{ if(!qa) return nomDe(a).localeCompare(nomDe(b),S.lang);
      const ia=norm(a[0]).indexOf(q), ib=norm(b[0]).indexOf(q);
      return (ia<0?99:ia)-(ib<0?99:ib) || nomDe(a).localeCompare(nomDe(b),S.lang) });
}

/* ---------- montre & sante ---------- */
function hhmm(min){ if(min==null) return "—"; const h=Math.floor(min/60); return `${h} h ${String(r0(min%60)).padStart(2,"0")}` }
function km(m){ return m==null?"—":(m/1000).toFixed(2) }

function blocComparaison(){

    return `<div class="card"><p class="eyebrow">${t("cmp_t")}</p>

  return `<div class="card">

        <th class="n">${t("cmp_ecart")}</th><th class="n">${t("cmp_retenu")}</th></tr></thead>

        <td class="n">${x.duree} min</td>
        <td class="n">${x.estime}</td>
        <td class="n">${x.mesure!=null?x.mesure:"—"}</td>
        <td class="n" style="color:${x.ecart==null?"var(--muted)":Math.abs(x.ecart)<=20?"var(--good)":"var(--warn)"}">${x.ecart==null?"—":(x.ecart>0?"+":"")+x.ecart+" %"}</td>
        <td class="n"><b>${x.retenu}</b></td></tr>`).join("")}</tbody></table></div>
    ${biais!=null?`<p class="hint" style="margin:12px 0 0">${t("cmp_biais")}
      <b style="color:${Math.abs(biais)<=20?"var(--good)":"var(--warn)"}">${biais>0?"+":""}${biais} %</b>.
      ${biais>20?t("cmp_sous"):biais<-20?t("cmp_sur"):t("cmp_bon")}</p>`:""}
  </div>`;
}

function vSante(){
  const h=santeDuJour(iso(new Date()));
  const derniers=[...Array(7)].map((_,k)=>{
    const d=iso(new Date(Date.now()-k*864e5)); return {d, v:S.sante.jours[d]};
  }).filter(x=>x.v);

  const nbJours=Object.keys(S.sante.jours).length;
  let tete;
  if(S.santeEtat==="absent"){
    tete=`<div class="empty"><strong>${t("s_absent_t")}</strong>${t("s_absent")}</div>`;
  } else {

/* ---------- entrainement ---------- */
/* Estimation de depense : met x poids x heures. Honnete a +/- 20 %, suffisant pour doser.
   Le met est l'equivalent metabolique de l'effort, mesure en laboratoire par type d'activite. */
function kcalCardio(met,minutes){ return r0(met*S.profil.poids*(minutes/60)) }

/* En musculation, le met depend surtout de la densite de la seance : les temps de repos
   comptent dans la duree mais pas dans l'effort, d'ou trois niveaux plutot qu'une valeur. */
const INTENSITES={
  legere:{met:3.5,t:["Legere — technique, repos longs","خفيفة — تقنية، راحة طويلة"]},
  moderee:{met:5,  t:["Moderee — hypertrophie classique","متوسطة — تضخيم كلاسيكي"]},
  intense:{met:6,  t:["Intense — lourd ou peu de repos","مكثفة — أوزان ثقيلة أو راحة قصيرة"]}
};
function kcalSeance(s){
  if(s.kcal!=null) return s.kcal;
  if(s.type==="cardio"){ const c=CARDIOS[s.prog]; return c?kcalCardio(c.met,s.duree||0):0 }
  const i=INTENSITES[s.intensite||"moderee"];
  return kcalCardio(i.met,s.duree||0);
}

function lireProfil(){
  const g=id=>document.getElementById(id);
  if(!g("f_poids")) return;
  const n=(id,d)=>{const v=parseFloat(g(id).value);return isFinite(v)?v:d};
  S.profil={sexe:g("f_sexe").value,age:n("f_age",30),taille:n("f_taille",175),
    poids:n("f_poids",75),cible:n("f_cible",72),activite:g("f_activite").value,
    objectif:g("f_objectif").value,rythme:g("f_rythme").value,
    protKg:n("f_prot",2),lipKg:n("f_lip",0.9)};
  S.profilCharge=true;
}
let tSave=0;
function sauveProfilDiffere(){ clearTimeout(tSave); tSave=setTimeout(sauveProfil,700) }
function majListe(){
  const h=document.getElementById("hits");
  if(h) h.innerHTML=blocHits(recherche().slice(0,40),S.sel);
  const b=document.getElementById("bbody");
  if(b) b.innerHTML=blocBase(recherche());
}
function majProfil(){
  const c=calculs(S.profil);
  document.getElementById("hdPoids").textContent=r1(S.profil.poids)+" "+t("kg");
  document.getElementById("hdKcal").textContent=c.kcal;
  const r=document.getElementById("res"); if(r) r.innerHTML=blocResultats(c);
  const ry=document.getElementById("f_rythme"); if(ry) ry.disabled=(S.profil.objectif==="maintien");
}

document.addEventListener("input",e=>{
  const x=e.target;
  if(x.id&&x.id.startsWith("f_")){ lireProfil(); majProfil(); sauveProfilDiffere(); return }
  if(x.id==="n_q"||x.id==="b_q"){ S.q=x.value; majListe(); return }
  if(x.id==="n_qte"){ const a=S.sel,q=parseFloat(x.value)||0,ap=document.getElementById("n_apercu");
    if(a&&ap) ap.innerHTML=apercu(a,q) }
  if(x.id==="cd_duree"){
    const cd=CARDIOS[S.cardio], m=parseFloat(x.value)||0, ap=document.getElementById("cd_apercu");
    if(ap) ap.innerHTML=`${t("c_estim")} <span class="num">${kcalCardio(cd.met,m)}</span> ${t("kcal")} ${t("c_pour")} ${r0(m)} min ${t("c_a")} ${r1(S.profil.poids)} ${t("kg")}.`;
  }
  if(x.id==="s_duree") majApercuMuscu();
});
function majApercuMuscu(){
  const d=document.getElementById("s_duree"), i=document.getElementById("s_int"),
        ap=document.getElementById("s_apercu");
  if(!d||!i||!ap) return;
  const m=parseFloat(d.value)||0;
  ap.innerHTML=`${t("c_estim")} <span class="num">${kcalCardio(INTENSITES[i.value].met,m)}</span> ${t("kcal")} ${t("c_pour")} ${r0(m)} min ${t("c_a")} ${r1(S.profil.poids)} ${t("kg")}.`;
}
document.addEventListener("change",e=>{
  if(e.target.id==="n_cat"||e.target.id==="b_cat"){ S.cat=e.target.value; majListe() }
  if(e.target.id==="s_int") majApercuMuscu();
  if(e.target.id==="r_nb"){ S.profil.nbRepas=+e.target.value; majProfil(); sauveProfilDiffere() }
  if(e.target.id==="s_dyn"){ S.sante.cibleDyn=e.target.checked; rend();
    ecrire(doc=>doc.set({profil:S.profil,photos:S.photos,sante:S.sante})) }
  /* ajouter un repas a une case du plan hebdomadaire */
  const ajout=e.target.dataset && e.target.dataset.addplan;
  if(ajout && e.target.value){
    const [js,ri]=ajout.split(":");
    S.semaine[js]=(S.semaine[js]||[]).concat([{ri:+ri,rid:e.target.value}]);
    rend();
    ecrire(doc=>doc.set({profil:S.profil,photos:S.photos,sante:S.sante,semaine:S.semaine}));
  }
});

document.addEventListener("click",async e=>{
  const b=e.target.closest("button"); if(!b) return;
  const d=b.dataset;

  if(d.lang){ S.lang=d.lang; try{localStorage.setItem("fm_lang",d.lang)}catch(_){} rend(); return }
  if(d.tab){ S.tab=d.tab; S.sel=null; rend(); return }
  if(d.prog){ S.prog=d.prog; rend(); return }
  if(d.sport){ S.sport=d.sport; S.mv=null; S.logCardio=null; rend(); return }
  if(d.cardio){ S.cardio=d.cardio; S.logCardio=null; rend(); return }
  if(d.mode){ S.modeAjout=d.mode; S.sel=null; rend(); return }
  if(d.jour!==undefined){ S.jourSem=+d.jour; rend(); return }

  /* --- repas composes --- */
  if(d.nommer!==undefined){ S.nommeRecette=+d.nommer; rend();
    const f=document.getElementById("rec_nom"); if(f) f.focus(); return }
  if(b.id==="rec_annule"){ S.nommeRecette=null; rend(); return }
  if(d.creerec!==undefined){
    const ri=+d.creerec, champ=document.getElementById("rec_nom");
    const nom=(champ&&champ.value.trim())||"";
    if(!nom){ if(champ) champ.focus(); return }
    const e=(S.journal[S.jour]||{entrees:[]}).entrees||[];
    const items=e.filter(x=>x.ri===ri).map(x=>({nom:x.nom,qte:x.qte}));
    if(!items.length) return;
    const id=nouvelId();
    S.recettes=S.recettes.concat([{id,nom,items}]);
    S.nommeRecette=null; rend();
    await ecrire(doc=>doc.collection("recettes").doc(id).set({nom,items})); return;
  }
  if(d.delrec){
    S.recettes=S.recettes.filter(r=>r.id!==d.delrec);
    for(const js of Object.keys(S.semaine))
      S.semaine[js]=S.semaine[js].filter(x=>x.rid!==d.delrec);
    rend();
    await ecrire(doc=>doc.collection("recettes").doc(d.delrec).delete()); return;
  }
  if(d.addrec){
    const r=recetteParId(d.addrec); if(!r) return;
    const q=parseFloat(document.getElementById("rq_"+d.addrec).value)||1;
    const ri=+document.getElementById("rp_"+d.addrec).value;
    const {doc:j}=versJournal(r,S.jour,ri,q);
    rend();
    await ecrire(doc=>doc.collection("journal").doc(S.jour).set(j)); return;
  }

  /* --- plan de la semaine --- */
  if(d.delplan){
    const [js,rid,ri]=d.delplan.split(":");
    S.semaine[js]=(S.semaine[js]||[]).filter(x=>!(x.rid===rid&&x.ri===+ri));
    rend();
    await ecrire(doc=>doc.set({profil:S.profil,photos:S.photos,sante:S.sante,semaine:S.semaine})); return;
  }
  if(d.appliquer!==undefined){
    const js=+d.appliquer; let total=0, j=null;
    for(const e of planDuJour(js)){
      const r=recetteParId(e.rid); if(!r) continue;
      const res=versJournal(r,S.jour,e.ri,1); j=res.doc; total+=res.n;
    }
    if(!j) return;
    S.tab="nutrition"; rend();
    await ecrire(doc=>doc.collection("journal").doc(S.jour).set(j)); return;
  }

  /* --- seance cardio --- */
  if(d.logcardio!==undefined){
    S.logCardio=+d.logcardio; rend();
    const z=document.getElementById("cardiozone"); if(z) z.scrollIntoView({behavior:"smooth",block:"center"});
    return;
  }
  if(b.id==="cd_cancel"){ S.logCardio=null; rend(); return }
  if(b.id==="cd_save"){
    const si=+b.dataset.si, cd=CARDIOS[S.cardio];
    const date=document.getElementById("cd_date").value||iso(new Date());
    const duree=parseFloat(document.getElementById("cd_duree").value);
    if(!isFinite(duree)||duree<=0) return;
    const dist=parseFloat(document.getElementById("cd_dist").value);
    const id=nouvelId();
    const s={type:"cardio",date,prog:S.cardio,si,duree,
             distance:isFinite(dist)?dist:null,kcal:kcalCardio(cd.met,duree)};
    S.seances=[{id,...s}].concat(S.seances).sort((a,b)=>a.date<b.date?1:-1);
    S.logCardio=null; rend();
    await ecrire(doc=>doc.collection("seances").doc(id).set(s)); return;
  }

  if(b.id==="s_ok"){
    const p=pontSante(); if(!p) return;
    try{ const ok=await p.permissions(); S.santeEtat=ok?"connecte":"a_autoriser"; if(ok) await litSante() }
    catch(err){ console.warn("permissions sante",err) }
    rend(); return;
  }
  if(b.id==="s_reglages"){
    const p=pontSante(); if(!p||!p.ouvrirReglages) return;
    try{ await p.ouvrirReglages() }catch(err){ console.warn("reglages sante",err) }
    return;
  }
  if(b.id==="s_maj"){
    b.disabled=true;
    try{ await litSante() }catch(err){ console.warn("lecture sante",err) }
    rend(); return;
  }

  if(d.mv){ S.mv=d.mv; rend();
    const z=document.getElementById("mvzone"); if(z) z.scrollIntoView({behavior:"smooth",block:"nearest"}); return }
  if(b.id==="mv_close"){ S.mv=null; rend(); return }

  if(d.photo){ e.stopPropagation(); S.pendPhoto=d.photo; document.getElementById("fileIn").click(); return }

  if(b.id==="p_add"){
    const dt=document.getElementById("p_date").value, v=parseFloat(document.getElementById("p_val").value);
    if(!dt||!isFinite(v)||v<35||v>250) return;
    S.pesees=S.pesees.filter(x=>x.date!==dt).concat([{date:dt,poids:v}]).sort((a,b)=>a.date<b.date?-1:1);
    if(dt===S.pesees[S.pesees.length-1].date){ S.profil.poids=v; sauveProfilDiffere() }
    rend();
    await ecrire(doc=>doc.collection("pesees").doc(dt).set({date:dt,poids:v}));
    return;
  }
  if(d.delpesee){
    S.pesees=S.pesees.filter(x=>x.date!==d.delpesee); rend();
    await ecrire(doc=>doc.collection("pesees").doc(d.delpesee).delete()); return;
  }

  if(b.id==="j_prev"||b.id==="j_next"){
    const dt=new Date(S.jour+"T12:00:00"); dt.setDate(dt.getDate()+(b.id==="j_next"?1:-1));
    S.jour=iso(dt); rend(); return;
  }
  if(b.id==="j_today"){ S.jour=iso(new Date()); rend(); return }
  if(d.pick!==undefined){ S.sel=recherche()[+d.pick]; rend(); return }
  if(b.id==="n_add"){
    const a=S.sel; if(!a) return;
    const qte=parseFloat(document.getElementById("n_qte").value);
    if(!isFinite(qte)||qte<=0) return;
    const ri=+document.getElementById("n_repas").value;
    const j=S.journal[S.jour]||{date:S.jour,v:2,entrees:[]};
    j.entrees=(j.entrees||[]).concat([{id:Date.now().toString(36)+Math.random().toString(36).slice(2,6),
      nom:a[0],ri,qte,kcal:a[2],p:a[3],g:a[4],l:a[5]}]);
    S.journal[S.jour]=j; S.sel=null; rend();
    await ecrire(doc=>doc.collection("journal").doc(S.jour).set(j)); return;
  }
  if(d.delentree){
    const j=S.journal[S.jour]; if(!j) return;
    j.entrees=j.entrees.filter(x=>x.id!==d.delentree); rend();
    await ecrire(doc=>doc.collection("journal").doc(j.date||S.jour).set(j)); return;
  }

  if(b.id==="a_add"){
    const g=id=>document.getElementById(id), msg=g("a_msg");
    const nom=g("a_nom").value.trim(), kcal=parseFloat(g("a_kcal").value);
    if(!nom||!isFinite(kcal)){ msg.textContent=t("creer_err"); return }
    const al={nom,nomAr:nom,cat:g("a_cat").value,kcal,p:parseFloat(g("a_p").value)||0,
      g:parseFloat(g("a_g").value)||0,l:parseFloat(g("a_l").value)||0};
    const id=Date.now().toString(36);
    S.persos=S.persos.concat([{id,...al}]);
    rend(); document.getElementById("a_msg").textContent=`« ${nom} » ${t("creer_ok")}`;
    await ecrire(doc=>doc.collection("aliments").doc(id).set(al)); return;
  }
  if(d.delalim){
    S.persos=S.persos.filter(x=>x.id!==d.delalim); rend();
    await ecrire(doc=>doc.collection("aliments").doc(d.delalim).delete()); return;
  }

  if(d.log!==undefined){
    const z=document.getElementById("logzone");
    z.innerHTML=formLog(+d.log); z.scrollIntoView({behavior:"smooth",block:"center"}); return;
  }
  if(b.id==="s_cancel"){ document.getElementById("logzone").innerHTML=""; return }
  if(b.id==="s_save"){
    const ji=+b.dataset.ji, j=PROGS[S.prog].jours[ji];
    const date=document.getElementById("s_date").value||iso(new Date());
    const lignes=j.ex.map(([ex],i)=>{
      const ch=parseFloat(document.querySelector(`[data-charge="${i}"]`).value);
      const rp=parseFloat(document.querySelector(`[data-reps="${i}"]`).value);
      return isFinite(ch)?{exo:ex,charge:ch,reps:isFinite(rp)?rp:0}:null;
    }).filter(Boolean);
    if(!lignes.length) return;
    const duree=parseFloat(document.getElementById("s_duree").value)||60;
    const intensite=document.getElementById("s_int").value;
    const id=nouvelId();
    const s={date,prog:S.prog,ji,lignes,duree,intensite,
             kcal:kcalCardio(INTENSITES[intensite].met,duree)};
    S.seances=[{id,...s}].concat(S.seances).sort((a,b)=>a.date<b.date?1:-1);
    rend();
    await ecrire(doc=>doc.collection("seances").doc(id).set(s)); return;
  }
  if(d.delseance){
    S.seances=S.seances.filter(x=>x.id!==d.delseance); rend();
    await ecrire(doc=>doc.collection("seances").doc(d.delseance).delete()); return;
  }
});

/* --- envoi d'une photo --- */
document.getElementById("fileIn").addEventListener("change",async e=>{
  const f=e.target.files&&e.target.files[0], cle=S.pendPhoto;
  e.target.value=""; S.pendPhoto=null;
  if(!f||!cle||!ASSETS) return;
  try{
    const res=await ASSETS.upload(f);
    S.photos={...S.photos,[cle]:res.id};
    rend();
    await sauveProfil();
  }catch(err){
    console.warn("upload refuse",err);
    const m=document.getElementById("a_msg"); if(m) m.textContent=t("photo_err");
  }
});

chargeLocal();
rend();
connecte();
brancheSante();
</script>
